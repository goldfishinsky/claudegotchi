name: claudegotchi
options:
  bundleIdPrefix: com.goldfishinsky
  xcodeVersion: "15.4"
  preferredProjectObjectVersion: 60
  postGenCommand: "sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' claudegotchi.xcodeproj/project.pbxproj"
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  PetCore:
    path: ../PetCore
targets:
  claudegotchi:
    type: application
    platform: macOS
    sources:
      - claudegotchi
    dependencies:
      - package: PetCore
        product: PetCore
    postBuildScripts:
      - name: Embed claudegotchi-hook
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPERS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS"
          PKG="${SRCROOT}/../PetCore"
          swift build --package-path "$PKG" -c release --product claudegotchi-hook
          SRC="$(swift build --package-path "$PKG" -c release --product claudegotchi-hook --show-bin-path)/claudegotchi-hook"
          cp -f "$SRC" "$HELPERS/claudegotchi-hook"
          chmod 0755 "$HELPERS/claudegotchi-hook"
          if [ "${ENABLE_HARDENED_RUNTIME:-}" = "YES" ] || [ "${CODE_SIGNING_ALLOWED:-}" = "YES" ]; then
            codesign --force --options runtime \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}" \
              "$HELPERS/claudegotchi-hook"
          fi
    info:
      path: claudegotchi/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: claudegotchi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 jalen"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfishinsky.claudegotchi
        ENABLE_HARDENED_RUNTIME: true
  claudegotchiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - claudegotchiTests
    dependencies:
      - target: claudegotchi
  claudegotchiUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - claudegotchiUITests
    dependencies:
      - target: claudegotchi
