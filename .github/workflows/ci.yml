name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  petcore-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Test PetCore
        working-directory: PetCore
        run: swift test --parallel
